<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — SGS AI Technology</title>
  <link rel="icon" type="image/png" href="/logo/sgsai-logo-gradient.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/global.css">
  <style>
    .error-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
    }
    .error-wrap h1 {
      font-family: var(--display);
      font-size: clamp(60px, 10vw, 120px);
      background: linear-gradient(100deg, #7538c4 5%, #128fc7 48%, #10b990 94%);
      -webkit-background-clip: text;
      color: transparent;
      margin: 0;
    }
    .error-wrap h2 {
      font-family: var(--display);
      font-size: 24px;
      margin: 10px 0 20px;
    }
  </style>
</head>
<body>
  <div class="error-wrap">
    <h1>404</h1>
    <h2>We couldn't find that page.</h2>
    <a href="/" class="button button-primary">Return Home <span>↗</span></a>
  </div>
</body>
</html>
